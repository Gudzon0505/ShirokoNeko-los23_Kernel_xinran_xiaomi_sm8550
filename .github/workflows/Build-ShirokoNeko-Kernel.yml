name: Build ShiroNeko Vermeer PRO
on:
  workflow_dispatch:

env:
  ARCH: arm64
  OUT_DIR: out
  DEFCONFIG: Xinran_PocoF6Pro_defconfig
  CLANG_VER: 15
  # Опционально: укажи URL официального boot.img (LineageOS 23) чтобы workflow извлёк ramdisk автоматически
  OFFICIAL_BOOT_URL: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout source (full history + submodules)
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install system packages and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git libelf-dev libssl-dev python3 python3-pip zip wget rsync dwarves \
            clang-${{ env.CLANG_VER }} lld-${{ env.CLANG_VER }} gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            mkbootimg abootimg device-tree-compiler cpio unzip zstd lz4
          # ensure basic tools available
          sudo apt-get install -y pkg-config

      - name: Prepare workspace bin and clang wrappers
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin
          for tool in clang ld.lld llvm-nm llvm-ar llvm-objcopy llvm-objdump llvm-strip llvm-readelf llvm-size; do
            if [ -x /usr/bin/${tool}-${{ env.CLANG_VER }} ]; then
              ln -sf /usr/bin/${tool}-${{ env.CLANG_VER }} $GITHUB_WORKSPACE/bin/${tool}
            fi
          done
          # add aarch64 toolchain to PATH if needed
          echo "/usr/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH
          export PATH=$GITHUB_WORKSPACE/bin:$PATH

      - name: Get avbtool from AOSP and create wrapper
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/external/avb avb || true
          cat > $GITHUB_WORKSPACE/bin/avbtool <<'EOF'
          #!/usr/bin/env bash
          python3 "$(dirname "$0")/../avb/avbtool.py" "$@"
          EOF
          chmod +x $GITHUB_WORKSPACE/bin/avbtool
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Show environment
        run: |
          echo "ARCH=${ARCH}"
          echo "OUT_DIR=${OUT_DIR}"
          echo "DEFCONFIG=${DEFCONFIG}"
          clang --version || true
          aarch64-linux-gnu-gcc --version || true
          python3 --version

      - name: Configure kernel defconfig and options
        run: |
          export ARCH=${ARCH}
          export PATH=$GITHUB_WORKSPACE/bin:$PATH
          make O=${OUT_DIR} ${DEFCONFIG}
          # Включаем критичные опции для Android 16 / LOS23 (адаптируй при необходимости)
          scripts/config --file ${OUT_DIR}/.config --enable CONFIG_INIT_BOOT || true
          scripts/config --file ${OUT_DIR}/.config --enable CONFIG_SECURITY_SELINUX || true
          scripts/config --file ${OUT_DIR}/.config --enable CONFIG_KSU || true
          make -C . O=${OUT_DIR} olddefconfig

      - name: Build kernel, dtbs and dtbo with verbose logging
        run: |
          export ARCH=${ARCH}
          export PATH=$GITHUB_WORKSPACE/bin:$PATH
          set -o pipefail
          # ensure defconfig applied
          make -j1 O=${OUT_DIR} ${DEFCONFIG}
          # build with verbose output; save log
          make V=1 -j$(nproc) O=${OUT_DIR} CC=clang LD=ld.lld LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs dtboimg 2>&1 | tee ${OUT_DIR}/build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "Kernel build failed. See ${OUT_DIR}/build.log" >&2
            exit 1
          fi

      - name: Obtain or extract ramdisk (from OFFICIAL_BOOT_URL or repo)
        run: |
          mkdir -p build_artifacts tools
          if [ -f tools/ramdisk.img ]; then
            cp tools/ramdisk.img build_artifacts/ramdisk.img
            echo "Using ramdisk from tools/ramdisk.img"
          elif [ -n "${{ env.OFFICIAL_BOOT_URL }}" ]; then
            echo "Downloading official boot.img from OFFICIAL_BOOT_URL"
            wget -q "${{ env.OFFICIAL_BOOT_URL }}" -O build_artifacts/official_boot.img
            if command -v abootimg >/dev/null 2>&1; then
              abootimg -x build_artifacts/official_boot.img || true
              if [ -f ramdisk.cpio.gz ]; then
                mv ramdisk.cpio.gz build_artifacts/ramdisk.img
              elif [ -f ramdisk.img ]; then
                mv ramdisk.img build_artifacts/ramdisk.img
              else
                echo "ERROR: ramdisk not found after abootimg extraction" >&2
                exit 1
              fi
            else
              echo "ERROR: abootimg not installed" >&2
              exit 1
            fi
          else
            echo "No ramdisk provided. Place tools/ramdisk.img or set OFFICIAL_BOOT_URL." >&2
            exit 1
          fi

      - name: Create Image.gz-dtb and collect dtbo
        run: |
          mkdir -p build_artifacts
          if [ -f ${OUT_DIR}/arch/arm64/boot/Image.gz ]; then
            if ls ${OUT_DIR}/arch/arm64/boot/dts/*.dtb >/dev/null 2>&1; then
              cat ${OUT_DIR}/arch/arm64/boot/Image.gz ${OUT_DIR}/arch/arm64/boot/dts/*.dtb > build_artifacts/Image.gz-dtb || true
            fi
            cp ${OUT_DIR}/arch/arm64/boot/Image.gz build_artifacts/Image.gz || true
          else
            cp ${OUT_DIR}/arch/arm64/boot/Image build_artifacts/Image || true
          fi
          if [ -f ${OUT_DIR}/arch/arm64/boot/dtbo.img ]; then
            cp ${OUT_DIR}/arch/arm64/boot/dtbo.img build_artifacts/dtbo.img
          fi
          ls -lah build_artifacts || true

      - name: Build boot.img using mkbootimg
        run: |
          set -e
          cd build_artifacts
          RAMDISK_PATH="build_artifacts/ramdisk.img"
          if [ ! -f "${RAMDISK_PATH}" ]; then
            echo "ERROR: ramdisk.img not found at ${RAMDISK_PATH}" >&2
            exit 1
          fi
          if [ -f Image.gz-dtb ]; then
            KERNEL_IMAGE="Image.gz-dtb"
          elif [ -f Image.gz ]; then
            KERNEL_IMAGE="Image.gz"
          elif [ -f Image ]; then
            KERNEL_IMAGE="Image"
          else
            echo "ERROR: kernel image not found" >&2
            exit 1
          fi
          # --- ВАЖНО: подставь CMDLINE, BASE и PAGESIZE из официального boot.img если знаешь ---
          CMDLINE="console=ttyMSM0,115200n8 androidboot.hardware=qcom"
          BASE="0x40000000"
          PAGESIZE="4096"
          mkbootimg --kernel ${KERNEL_IMAGE} --ramdisk ${RAMDISK_PATH} --cmdline "${CMDLINE}" --base ${BASE} --pagesize ${PAGESIZE} -o boot.img
          ls -lah boot.img || true

      - name: Prepare AnyKernel3 package
        run: |
          rm -rf anykernel
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 anykernel || true
          cp build_artifacts/boot.img anykernel/boot.img || true
          cp build_artifacts/dtbo.img anykernel/dtbo.img || true
          cd anykernel
          zip -r9 ../ShiroNeko-AnyKernel.zip . -x .git\* || true
          cd ..

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: ShiroNeko-artifacts
          path: |
            build_artifacts/boot.img
            build_artifacts/dtbo.img
            ShiroNeko-AnyKernel.zip
            ${OUT_DIR}/.config
            ${OUT_DIR}/build.log

      - name: Print short build log tail
        if: always()
        run: |
          echo "=== Build log tail ==="
          if [ -f ${OUT_DIR}/build.log ]; then
            tail -n 200 ${OUT_DIR}/build.log || true
          else
            echo "No build.log found"
          fi

      - name: Success message
        if: success()
        run: |
          echo "Build finished. Artifacts uploaded. Test boot.img via fastboot: fastboot flash boot boot.img"
          echo "If device uses AVB, test with: fastboot --disable-verity --disable-verification flash vbmeta vbmeta.img (manual step)."
